# ─────────────────────────────────────────────────────────────────────────────
# Netlify Configuration for Hekimika (hekimika.org)
# ─────────────────────────────────────────────────────────────────────────────

[build]
  # The frontend lives inside /client
  base    = "client"
  command = "npm run build"
  # Vite outputs to client/dist
  publish = "dist"

[build.environment]
  # Ensure Node version is consistent
  NODE_VERSION = "20"

# ─── SPA Redirect ────────────────────────────────────────────────────────────
# This is CRITICAL. Without this, any direct link to /blog/my-post or
# /programs/school-of-purity will return a 404 from Netlify instead of
# being handled by React Router.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ─── Security & Modern Protection Headers ────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: http:; media-src 'self' https: blob:; frame-src 'self' https://www.youtube.com https://youtube.com https://open.spotify.com; object-src 'none'; base-uri 'self';"

# Cache static JS/CSS assets aggressively (they have content hashes in filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache favicon and static brand media
[[headers]]
  for = "/favicon/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Do not cache index.html (so new deploys are picked up immediately)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
